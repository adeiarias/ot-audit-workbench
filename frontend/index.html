<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Tema antes del primer pintado (evita el parpadeo claro→oscuro)
      try {
        var t = JSON.parse(localStorage.getItem("audit-theme") || "{}");
        var m = t.mode || "system";
        document.documentElement.classList.toggle("dark", m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches));
        document.documentElement.dataset.themePreset = t.preset || "audit";
      } catch (e) {
        document.documentElement.dataset.themePreset = "audit";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
