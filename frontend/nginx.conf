server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 512m;   # subida de pcaps y evidencias

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;            # el backend valida Host y Origin (AUDIT_ALLOWED_*)
    proxy_set_header Origin $http_origin;
    proxy_set_header Upgrade $http_upgrade; # WebSocket de la campaña
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;                  # escaneos y chat largos
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location / {
    try_files $uri /index.html;             # rutas de react-router
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
